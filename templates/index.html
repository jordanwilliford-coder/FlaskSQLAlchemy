{% extends 'base.html' %}

{% block title %}Students{% endblock %}

{% block content %}
  <h1>Students</h1>
  {% for student in students %}
    <p><a href="{{ url_for('student', student_id=student.id) }}">
      {{ student.firstname }} {{ student.lastname }}</a> ({{ student.email }})</p>
  {% endfor %}
{% endblock %}
